l_english:
 sinosauria_succession:0 "The Sinese Succession"
 sinosauria_succession_desc:0 "With the empersaur now dead, the state and government is essentially paralyzed. We must choose and coronate a new leader for our country, else lawlessness and anarchy will ensue."
 zhong_long_succession:0 "Zhong Long's Successor"
 zhong_long_succession_desc:0 "The country is split between which path of succession to follow. Although Di Long is Zhong Long's son and designated heir, he is young and not fit to rule the greatest empire in the world. Fu Xi is a suitable candidate, being the head of the armed forces and a famed general. However, court officials fear that if he ascends to the throne, there would not be much to stop him from establishing a reign of terror and absolutism. He would also secure China's dynasty and not allow for the progressive ideals of democracy to flourish."
 sinosauria_fu_xi_opposition_government:0 "Fu Xi's Opposition"
 sinosauria_fu_xi_opposition_government_desc:0 "Our choice to allow the council to govern the country through Di Long has angered Fu Xi and the military elite, as well as other reactionary members of Sinosauria. We must weaken Xi's opposition through any means possible to preserve the government."
 sinosauria_council_opposition_government:0 "The Court's Opposition"
 sinosauria_council_opposition_government_desc:0 "The Imperial Court has formed their own government organization in Sinosauria, plotting a rebellion against us! They must be weakened in any means possible."
 sinosauria_council_secure_the_frontiers:0 "Secure the Frontiers"
 sinosauria_council_secure_the_frontiers_desc:0 "With much of the military weakened, nomadic raiders have taken the oppurtunity to plunder the countryside, disappearing before our forces arrive to disperse them. We must actively position our troops to protect our fellow countrymen from these foreign barbarians."
 unite_irhazia_category:0 "Unite Irhazia"
 form_gobero:0 "Form Gobero"
 form_irhazia:0 "Form Irhazia"
 unite_irhazia_category_desc:0 "For centuries, Irhazia had remained a fractured kingdom with regional kings constantly fighting each other for dominance. With our dominance over all other Irhazian kings, we may finally claim hegemony over Irhazia and unite it once and for all."
 raise_the_adidsoshas_category:0 "Raise the Adidsoshas"
 raise_the_adidsoshas_category_desc:0 "Herbivores in Afrovian society live harsh and unfair lives, being considered less than the average Afrovenator. However, the military brings oppurtunity to herbivores, as it views all soldiers as protectors of Afrovia, deserving respect. In order to better their social standing, many herbivores have joined together to form the Adidsoshas, elite warriors that serve our state loyally. They can be called to arms and protect our homeland whenever our enemies dare to challenge us."
 mission_to_modernize_category:0 "Mission to Modernize"
 mission_to_modernize_category_desc:0 "[ROOT.GetMissionToModernizeDesc]"
 mission_to_modernize_category_not_active_desc:0 "In order to assert our country into a place of great power, we must adopt the institutions of a modern nation. This will be a monumental task, and many will stand against our effort to bring our country into greatness.\n\nWe have not begun modernization yet."
 mission_to_modernize_category_active_desc:0 "In order to assert our country into a place of great power, we must adopt the institutions of a modern nation. This will be a monumental task, and many will stand against our effort to bring our country into greatness.\n\nWe are currently §H[?modernprogress]%§! towards completing modernization."
 mission_to_modernize_category_finished_desc:0 "In order to assert our country into a place of great power, we must adopt the institutions of a modern nation. This will be a monumental task, and many will stand against our effort to bring our country into greatness.\n\n§HWe have enough modernization progress to modernize!§!"
 begin_modernization:0 "Begin Modernization"
 modernization_progress:0 "Modernization Progress"
 modernization_progress_desc:0 "Every 2 months, our modernization progress will increase. Events and stability will affect the modernization progress. The lower our stability, the less modernization progress we will gain per month, and the more likely populations will rise to reject our efforts."
 placate_nobility:0 "Placate Nobility"
 placate_nobility_desc:0 "Assure our nobility that their rights will definitely not be infringed by the radical changes of modernization, and keep them in blissful ignorance for a little while more..."
 seize_foreign_assets:0 "Seize Foreign Assets"
 seize_foreign_assets_desc:0 "No more will the foreign insects grow fat off the labor of our people! The time has come to seize all assets owned by outsiders, to be cared for by the state."
 modernize:0 "Modernize"
