 SIN_fu_xi:0 "Fu Xi"
 SIN_chaiyou_huang:0 "Chaiyou Huang"
 uncivilized_nation:0 "Uncivilized Nation"
 uncivilized_nation_desc:0 "The country is not caught up with the institutions of modern countries, which in turn makes it more difficult to research and develop new technologies."
 partially_modernized_nation:0 "Partially Modernized Nation"
 partially_modernized_nation_desc:0 "The country has adopted some modern reforms that mirrors western countries, but still is not fully modernized to keep up with research and development."
 newly_modernized_nation:0 "Newly Modernized Nation"
 newly_modernized_nation_desc:0 "The country has adopted all institutions of a modern nation and is researching technologies adopted by western countries."
 SIB_belogvardyetsi_alliance:0 "Belogvardyetsi Alliance"
 SIB_belogvardyetsi_alliance_desc:0 "Our alignment with the Tsaurdom of Siberya in the Siberyan Civil War gives us improved combat abilities against the Reds."
 SAR_yearn_for_the_tsaur:0 "Yearn for the Tsaur"
 SAR_yearn_for_the_tsaur_desc:0 "The general ruin of the Saurviet Union demoralises the people to wish that things were back to the way they were. To counter this ideology we must insure our people and censor any white propaganda. If neutrality support increases past a certain threshold, we might see parts of our country switch allegiance!"
 SAR_siberyan_civil_war:0 "The Siberyan Civil War"
 SAR_siberyan_civil_war_desc:0 "We are currently engaged in a civil war between the newly formed Saurviet Union and the Saurdom of Siberya."
 SAR_tsaurdomist_sympathies:0 "Tsaurdomist Sympathies"
 SAR_tsaurdomist_sympathies_desc:0 "Some officers and soldiers of our liberation armies still hold loyalties to the Tsaurdom. Whether through sabotage, incompetence, or espionage, they hinder our ability to combat the Whites."
 SIN_mourn_for_the_empersaur:0 "Mourn for the Empersaur"
 SIN_mourn_for_the_empersaur_desc:0 "A 40 day mourning period has been set for our greatest leader, Zhong Long. Citizens of Sinosauria leave their daily routines to pay respects to the Empersaur who has provided them with safety and greatness."
 SIN_fu_xi_defiant:0 "Fu Xi Defiant"
 SIN_fu_xi_defiant_desc:0 "Despite a fair and free agreement to allow the council to guide Di Long rule, Fu Xi is too stubborn to be a subordinate of the child empersaur. Using his political and military fame, he denounces the council for being greedy and corrupt, taking himself and major parts of the military away from the court's control. We must effortly refill the gaps of the military Fu Xi has brought to Sinosauria."
 SIN_disunified_government:0 "Disunified Government"
 SIN_disunified_government_desc:0 "Our regent, although fairly assuming the throne as regent of Di Long, is having heavy opposition with the court. They have abandoned the government seeing Fu Xi stopping their ambitions in reforming the monarchy. Many have left their posts in government in protest, and others continue to serve with disloyalty and corruption. Great effort must be used to replace these traitors with new, loyal administrators."
 SIN_ineffective_tax:0 "Ineffective Tax Laws"
 SIN_ineffective_tax_desc:0 "Our current tax laws are not enforced enough by local administrators. Less money is going into the state."
 SIN_corrupt_bureaucrats:0 "Corrupt Bureaucrats"
 SIN_corrupt_bureaucrats_desc:0 "Many court officials are utilizing the instability of Sinosauria to benefit themselves rather than the state."
 SIN_brane_drane3:0 "The Brane Drain"
 SIN_brane_drane3_desc:0 "Talented and educated elites of Sinosauria have left to follow the court's ruling. In order to counter their absence, we need to focus on education across Sinosauria."
 SIN_brane_drane2:0 "The Brane Drain"
 SIN_brane_drane2_desc:0 "Talented and educated elites of Sinosauria have left to follow the court's ruling. In order to counter their absence, we need to focus on education across Sinosauria."
 SIN_brane_drane1:0 "The Brane Drain"
 SIN_brane_drane1_desc:0 "Talented and educated elites of Sinosauria have left to follow the court's ruling. In order to counter their absence, we need to focus on education across Sinosauria."
 SIN_ineffective_draft:0 "Ineffective Draft"
 SIN_ineffective_draft_desc:0 "Military officials tasked with drafting local populations have left to follow their leader, Fu Xi. We must implement drafts of our own to counter this."
 SIN_inexperienced_officers:0 "Inexperienced Officers"
 SIN_inexperienced_officers_desc:0 "Many of our veteran soldiers and officers have left fearing the end of the monarchy, and have been replaced by new officers inexperienced with war."
 SIN_military_disloyalty:0 "Military Disloyalty"
 SIN_military_disloyalty_desc:0 "Soldiers of our armies are regularly told that Fu Xi is the savior of the Long Dynasty and that our court is corrupt to western ideologies. Their morale is compromised and many desert to Fu Xi's government."
 ABE_lanca_accords:0 "The Lanca Accords"
 ABE_lanca_accords_desc:0 "On the 7th day of the 7th month of the year 1888, the Alliance of the Lance managed to defeat and capture a force of over 40,000 of avalonian imperialists in the Battle for Abeliz. In exchange for the enemies' liberation, these foreigners agreed to the Lanca Accords, which, for 50 years, would expell all foreign influence and trade from the homeland. The defeat of these technologically superior barbarians by our fierce warriors imposes a great sense of pride in all our countrymen's hearts!"