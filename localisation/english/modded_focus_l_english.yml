l_english:
 SIN_fu_xi_reigns:0 "Fu Xi Reigns"
 SIN_fu_xi_reigns_desc:0 "Fu Xi has been chosen as the legitimate regent for the child empersaur Di Long... only time will tell what the court will do."
 SIN_education_focus:0 "Renewed Education"
 SIN_education_focus_desc:0 "For a proper and modern nation, we need a large literate population. New education programs and schools will achieve this."
 SIN_sinese_research_and_development:0 "Sinese Research and Development"
 SIN_sinese_research_and_development_desc:0 "To update our outdated technology, we must tackle research and development with renewed vigor."
 SIN_educated_ministers:0 "Educated Ministers"
 SIN_educated_ministers_desc:0 "In order to replace skilled administrators that had left to follow the council, we must find those educated enough to replace them."
 SIN_beitu_universities:0 "Beitu Universities"
 SIN_beitu_universities_desc:0 "Establishing schools and universities in Sinosauria is essential if we want to modernise and become a prosperous nation."
 SIN_restart_civil_service_exams:0 "Restart Civil Service Exams"
 SIN_restart_civil_service_exams_desc:0 "To find proper and skilled replacements for those that followed the council, new emphasis should be placed on the civil service exams."
 SIN_a_new_administration:0 "New Administration"
 SIN_a_new_administration_desc:0 "With enough skilled administrators recruited, we can reform the current administrative model, preventing corruption and political meddling."
 SIN_reorganize_tax_collection:0 "Reorganize Tax Collection"
 SIN_reorganize_tax_collection_desc:0 "Many tax collectors are lacking in their quotas. New tax laws, although unpopular to the population, is necessary for the proper function of the state."
 SIN_the_council_obsolete:0 "The Council Obsolete"
 SIN_the_council_obsolete_desc:0 "With many steps taken to replace the administration of the council, we can now take the final preparations to end all influence the council has in our government."
 SIN_administrative_audits:0 "Administrative Audits"
 SIN_administrative_audits_desc:0 "In order to clamp down on corruption, we must launch a series of tests on our current administrators."
 SIN_neizheng_department:0 "The Neizheng Department"
 SIN_neizheng_department_desc:0 "Our citizens have been constantly exposed to western and court propaganda. The state must monitor the freedom of speech and expression, so our population will no longer be exposed to 'lies'. The Neizheng, or truth, must be upheld."
 SIN_expatriate_the_traitors:0 "Expatriate The Traitors"
 SIN_expatriate_the_traitors_desc:0 "Those who abandoned the dynasty must pay for their treason. Harsh punishment along with the revocation of their identities will make those who followed the council regret and those who plan to follow reconsider."
 SIN_offer_amnesty:0 "Offer Amnesty"
 SIN_offer_amnesty_desc:0 "In order to weaken the council's power, we should let those who follow them return to our side, free of all punishment. Once the council's greediness and corruption has been realized, their followers will be returned as free people."
 SIN_fund_the_fenghong:0 "Fund the Fenghong"
 SIN_fund_the_fenghong_desc:0 "The Fenghong, or pinks, are a militarized, far-right nationalist group. To triumph against the council, we must require their help."
 SIN_the_marshal_heir:0 "The Marshal Heir"
 SIN_the_marshal_heir_desc:0 "The child of Zhong Long is still too young and too innocent to rule over the greatest empire in Laurasia. He's probably influenced by the court as well, and is probably a communist anyways, along with any other power that could replace Fu Xi. Whatever the situation, our troops and our subjects, will work, fight, and die for the great marshal empersaur, Fu Xi!"
 SIN_the_righteous_heir:0 "The Righteous Heir"
 SIN_the_righteous_heir_desc:0 "The time has come to end Fu Xi's glorious rule as regent. For the good of Sinosauria, Di Long will rightfully ascend as heir to the great empersaur Zhong."
 SIN_regency_council:0 "The Regency Council"
 SIN_regency_council_desc:0 "A Regency council has been set up for the child emperor. Only time will tell how the marshal Fu Xi plans to react..."
 SIN_secure_the_frontiers:0 "Secure the Frontiers"
 SIN_secure_the_frontiers_desc:0 "Our army is severely weakened from Fu Xi's secession. Taking advantage of this, nomadic raiders from the Bei mountains have crossed into our borders, plundering the countryside and terrorizing our people. They must be dealt with as soon as possible!"
 SIN_purge_the_bandits:0 "Purge the Bandits"
 SIN_purge_the_bandits_desc:0 "With military leaving the area, Banditry reigns in the deserts of Sinosauria and the cities of the south. Law must be reimplemented in these areas before any more damage can be done."
 SIN_expatriate_the_pinghai:0 "War on the Gasosaurs"
 SIN_expatriate_the_pinghai_desc:0 "The communist gasosaurs of Pinghai are an imminent threat to the regime and must be dealt with."
 SIN_align_the_pinghai:0 "Alliance with the Communists"
 SIN_align_the_pinghai_desc:0 "Although the communists plan to overthrow the monarchy to establish a socialist republic, the time is desperate enough that we should consider an alliance with the Gasosaurs."
 SIN_military_concessions:0 "Secure the Frontiers"
 SIN_military_concessions_desc:0 "Our army suffers from many soldiers of different ranks deserting us to follow Fu Xi. Their reasons are mixed, from lack of pay to unfair treatment. Conceding to some demands of the military can weaken Xi's ranks and make our military much more loyal to our council."
 SIN_western_science:0 "Western Science"
 SIN_western_science_desc:0 "Our nation's technology is outdated. Fortunately, our position as the great power of the east allows us to access western knowledge through trade. By researching these we can hope to adopt more advanced technologies"
 SIN_military_exams:0 "Military Exams"
 SIN_military_exams_desc:0 "With most of our officers gone and replaced with inexperienced , we must reintroduce military exams to find proper replacements for them."
 SIN_encourage_conscription:0 "Encourage Conscription"
 SIN_encourage_conscription_desc:0 "With our military staff gone and meddling with our recruitment, the hordes of the north are putting us in a desperate situation. Conscription laws must be implemented so that our nation is not defenseless."
 SIN_a_western_military:0 "A Western Military"
 SIN_a_western_military_desc:0 "In order for a strong military, we need to reorganize our armies into coordinated structures. Adopting western military structures will allow easier logistics and command of a large army."
 SIN_general_staff:0 "General Staff"
 SIN_general_staff_desc:0 "Establishing a group of talented officers to command our armies is necessary for coordinated attacks and defense in wars."
 SIN_a_new_military:0 "A New Military"
 SIN_a_new_military_desc:0 "With our army modernized and restrengthened, we can take the final preparations to purge the military of any influence from Fu Xi or his allies!"
 SIN_western_academies:0 "Western Academies"
 SIN_western_academies_desc:0 "We can adopt the education systems of western countries to benefit the education of our own people."
 SIN_weapons_of_war:0 "Weapons of War"
 SIN_weapons_of_war_desc:0 "Adopting western technologies can give us a boost in researching new weapons for warfare."
 mission_to_modernize:0 "Mission to Modernize"
 mission_to_modernize_desc:0 "It has become clear that in order to become a major power in the world, we must adopt the aspects of a modern nation. This will be a hard task, but with adequate preparation we will prevail."
 CRI_inspire_the_spinotrophs:0 "Inspire the Spinotrophs"
 CRI_inspire_the_spinotrophs_desc:0 "The Spinotrophs of Lappentia live harsh, unjust lives under the tyrannical herbivorous king Fariqtrof. We must bring the Spinostropheusian dinosaurs news that there are better alternatives than blindly serving a weak regime."
 CRI_dispute_of_tegama:0 "Inspire the Spinotrophs"
 CRI_dispute_of_tegama_desc:0 "King Farikoste, predecessor of Fariqtrof, established in his inheritance that the spinostropheuses of Tegama would be free to choose their destiny, under continued rule by the Spinophors or fall under our hands, as a sign of his good will to us. When Fariqtrof ascended to the Lappentian throne, no answer came from the Tegamans. This gives legitimate ground to claim Tegama as rightfully ours."
 CRI_pharusian_ultimatum:0 "The Pharusian Ultimatum"
 CRI_pharusian_ultimatum_desc:0 "Try as the herbivores may, the spinostropheuses will never live true, fair lives under Fariqtrof. Only under carnivorous rule may the carnivorous citizens of Lappentia exist fair and free."
 CRI_expel_the_herbivores:0 "Expel the Herbivores"
 CRI_expel_the_herbivores_desc:0 "The herbivores that supported Fariqtrof now disguise themselves as subjects of our empire. They must be expelled from what was once the heartland of the spinostropheus, before they plot a rebellion and bring Fariqtrof back to the Lappentian throne."
 CRI_clemency_for_herbivores:0 "Clemency For the Herbivores"
 CRI_clemency_for_herbivores_desc:0 "To treat the herbivores of Lappentia unjustly would be the purest form of hypocrisy. We will not repeat the mistakes that Fariqtrof has made and pursue a society where carnivores and herbivores live in equality."
 CRI_develop_lappente:0 "Develop Lappente"
 CRI_develop_lappente_desc:0 "Lappente is a poorly developed region that has potential to become a major producer of natural resources. Developing the region will allow us to access large deposits of resources in the future."
 CRI_tegama_oil_fields:0 "Tegaman Oil Fields"
 CRI_tegama_oil_fields_desc:0 "Tegama is rich in oil, which is a desired resource for us and foreigners. Expanding the oil Industry in Tegama will empower both our motor vehicles and our economy."
 CRI_Lappente_industry:0 "Tegaman Oil Fields"
 CRI_Lappente_industry_desc:0 "Developing the Industry in Lappente will allow us to pursue even bigger projects in the future."
 CRI_mission_to_modernize:0 "Mission to Modernize"
 CRI_mission_to_modernize_desc:0 "It has become clear that in order to become a major power in the world, we must adopt the aspects of a modern nation. This will be a hard task, but with adequate preparation we will prevail."
 CRI_university_of_assaouas:0 "University of Assaouas"
 CRI_university_of_assaouas_desc:0 "The University of Assaouas used to be a center of knowledge and education, but has been sadly neglected by our previous administrators. We will restore the university to its former glory, and renew the urge to learn among all Cristatu citizens."
 CRI_foreign_educators:0 "Foreign Educators"
 CRI_foreign_educators_desc:0 "Though our relations with the Avalonian foreigners have been tense, it would be foolish to develop the institutions of modernization ourselves when these foreigners already have the knowledge of them. Through these educators we will be able to modernize much faster."
 CRI_experimental_railways:0 "Experimental Railways"
 CRI_experimental_railways_desc:0 "Tales from foreign lands tell of metal benemoths capable of moving mountains across entire continents. We should learn as much as possible and develop our own metal benemoths as soon as possible."
 CRI_taidemait_assaouas_railroad:0 "Taidemaït-Assaouas Railway"
 CRI_taidemait_assaouas_railroad_desc:0 "Trains have been proven to be a very useful concept for transporting goods and dinosaurs across Cristatu, allowing us to establish settlements deep into the Illummeden desert. Establishing a central railway between our urban zones where smaller railroads can diverge from, we can create a well organized railroad network."
 CRI_modern_manufactories:0 "Modern Manufactories"
 CRI_modern_manufactories_desc:0 "Our traditional way of making things is far to inefficient to supply a modern society. Replacing a single weapons"
 CRI_civilian_industry_1:0 "Civilian Industry I"
 CRI_civilian_industry_2:0 "Civilian Industry II"
 CRI_westernization_effort_II:0 "Westernization Effort II"