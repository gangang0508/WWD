l_english:
 BM_HISTORY_TITLE:0 "Brief History"
 DINOSAUR_NAME:0 "Dinosaur Era"
 DINOSAUR_DESC:0 "Within the vast forests of Laurasia, the Alioramus Sergei Kursaurnov unites a vast empire of carnivores. Seeking the subjugation of all herbivores, Kursaurnov eyes the Plateosaurids of Proto-Europe with hunger, metaphorically and literally. In the eastern cratons, the Achillobators of the Dorongovi plain unite to form the Oirapts. It's armies now threaten the heartland of a fractured and weakened Sinosauria."
 HITTING_FAN_NAME:0 "The Hitting of the Fan"
 HITTING_FAN_DESC:0 "Yup, that's right! That umbrella collection is about to come in real handy."
 SAU_DINOSAUR_DESC:0 "The Great Hadrosaurid rebellion shook the Saurdom to it's very core. The once proud Siberian empire lays in fragments, and it's people are growing hungry. With the Tsaur ousted, the new carnivorous government promises a change in the nation's course.\n\nSeeking to feed his uneasy population, Kursaurnov's ambition eyes the Plateosaurs and the Hadrosaurids of the Proto-European plain. With the Herbivore Purges, it would seem the Saurviet Union's ambition has already commenced..."
 OTHER_DINOSAUR_DESC:0 "Herbivores and Carnivores of the world, living in harmony or in hatred, are faced with a dilemma not all are content to choose. With extreme radical ideologies developing promising the annhilation of either race, these small civilizations have little option. Either they hope that non-alignment save them, or they enter the radicalism seeking protection of others. No matter which path these species pick, it is for certainty not all species will survive."
 SIN_DINOSAUR_DESC:0 "Zhong Lóng, the last great Sino Empersaur, lies dying in his palace in Beitu. His only heir, Di Lóng, a 4 year old abrosaurus, is in line for succession. However, the regency set up in advance for him becomes increasingly likely to plot to take the throne themselves. Sensing the impending doom of Sinosauria, the Oirapt hordes of the Dorongovi mountains break free from their tributary status, and others follow suit. Rebuilding their militaries, they are seeing Sinosauria as less of an overlord, and more like a land of oppurtunity."
 TRI_DINOSAUR_DESC:0 "The Triceratops of the Third Republic are uneasy. A carnivorous nation lies on their border, eager to invade the herbivorous nation if the government stumbles. The rise of Tyrannia in the west, as well as the Allosaurus rebellion in the south only fortifies the idea of growing carnivorous influence. Some seek a coalition of other herbivores in Laurentia, and others take up arms to combat their to be predators. Whichever path the Third Ceratop Republic follows, it's position will change the future of Laurentia forever."
 TYR_DINOSAUR_DESC:0 "Forged from the collapse of Apatosauria, the Tyrannosaurs of Tyrannia establish a base in eastern laurentia. Their country truly proves to be of the apex, with a trembling military and large industry. Not all are eager to follow the regime however; the herbivores that saw high privileges during the Apatosaurus reign now sees their species decline under Tyrannia. Will Herbivores and Carnivores choose to co-exist and forge a peaceful dominion across Laurentia, or will the different species come to odds?"
 HER_DINOSAUR_DESC:0 "The Herbman Empire is the greatest bastion of the herbivores. Carnivores and herbivores live in mutualism unprecedented in any authoritarian government, with near equal rights and place in society. However, with the hadrosaurid rebellions and the Saurviet Union's rise, carnivores and herbivores distance each other within the realm, causing a fractured government and social classes. Most notably, the pro-herbivorous NPFKP preaches the complete annhilation of carnivores, and wins a concerning margin in the Diet. With the growing nationalism, the future of carnivores and the Imperial government is uncertain."
 ABE_DINOSAUR_DESC:0 "The Abelisaurids brought carnivores and herbivores alike down to their knees, forcing them to adopt tributary status. Forging a massive empire, their military strength was even enough to repulse the greedy hands of Avalonian colonizers. The Cuoro Accords made it so no Avalonian colonizer will set foot on the new world. Their rich empire is a double edged sword, however, as the more tribute they recieve, the increasingly rebellious their tributaries get. The rich tributary of Chicxulub has stopped paying altogether. The Abelisaurs must prepare for the rebellion that is to come."
 ICH_DINOSAUR_DESC:0 "The Ichithyosaurs rules the west European terranes, uniting the disparate mosasaurs into a great power. Ichaly's naval prowess is unparalleled, forged through evolution. Mosasaurs aren't dexterous enough to perform tasks on land, so Ichaly relies on terrestrial carnivores and herbivores to do jobs such as construction and manufacturing. However, As the news of the hadrosaurid rebellion hit home, the populations of carnivores and herbivores begin to squabble, slowing down national progress. The civil disorder between carnivores and herbivores might just prove too great for the mosasaur empire."
 
 