l_english:
 meteor.1.t:0 "Meteor Sighted!"
 meteor.1.d:0 "Dinosaurs are always superstituous, and the appearance of a meteor in the sky has caused panic among our people. They are convinced that this is a sign that the end of times is near or that something bad is going to happen in the near future."
 meteor.1.a:0 "It's an Omen"
 meteor.1.b:0 "Our extinction is nigh!"
 meteor.1.c:0 "If only we saur this coming..."
 sinosauria.1.t:0 "The Pinghai Rebellion!"
 sinosauria.1.d:0 "My Empersaur, the situation is dire in Pinghai! Utilizing the low stability, Chaiyou Huang, a radical communist, unites the gasosaur workers of Pinghai to revolt! He promises to bring radical reforms of communism to the empire and bring an end to the dynasty. Many of the imperial guard joined Pinghai rebellion, and multiple forts in the area are put under siege. Worse, the Sanjeng arsenal has given up it's arms with no resistance. This is the largest rebellion Sinosauria will see in it's existence. What will we do?"
 sinosauria.1.a:0 "Crush them and give me Chaiyou's head!"
 sinosauria.1.b:0 "Empersaur? Call me Chairman instead."
 sinosauria.2.t:0 "Succession?"
 sinosauria.2.d:0 "Zhong Long has passed away. It is decided in the imperial court that his designated heir is not fit for the throne. Immediately, factions begun rising within the court, bickering over the candidates who should act as Di Long's regent. Fu Xi, Zhong Long's brother and military general, announced himself as the rightful regent. The court nominates a select council of it's members that would 'advise' the young empersaur to govern 'properly'. Which choice should we follow?"
 sinosauria.2.a:0 "Fu Xi takes the regency."
 sinosauria.2.b:0 "Advisors will help Di Long rule."
 sinosauria.0.t:0 "The Death of Zhong Long"
 sinosauria.0.d:0 "Yesterday, Zhong Long, the empersaur of Sinosauria, has passed away to old age. Within his reign, he established tributaries across Laurasia, subjugating the Velociraptors of Dornogovi and the Psittacosaurs of Psiam. His administration allowed the empire to recover from decades of corrupt and inefficient rule.\n\nZhong Long's body was embalmed and a funeral was held in Tianxian Square, where hundreds of thousands attended. Following tradition, Zhong Long's personal belongings, garments, treasures, and luxuries were burnt during his burial. A 40 day mourning period was put in place across Sinosauria. A succession crisis has ensued, with Zhong leaving only a 2 year old son as his heir."
 sinosauria.4.a:0 "Not good."
 sinosauria.4.t:0 "Fu Xi Defies the Court!"
 sinosauria.4.d:0 "With the coronation of Di Long, Fu Xi has declared the imperial court illegitimate and corrupt, and refuses to be subservient under us. Taking a large part of the army with him, Fu Xi declares that he will 'restore the true mandate' very soon. Fu Xi's secession has left huge gaps in the military, and our forces are scrambled. With the head of our army and most of our generals gone, Sinosauria's might will be greatly hindered."
 sinosauria.5.a:0 "Not good."
 sinosauria.5.t:0 "Court Declares Xi Illegitimate!"
 sinosauria.5.d:0 "As Fu Xi assumes the throne as regent, the court watches in dismay as their ambitions are hindered. Unwilling to serve what they assume is a military tyrant, many factions of the court are beginning to abandon their roles as administrators of government. Many skilled parts of our government have been replaced with inexperienced officials, and those who remained in the government show corruption and sabotage. Skilled leaders must be found to replace these traitors."
 sinosauria.6.c:0 "We can spare nothing."
 sinosauria.6.b:0 "Perhaps broker some deal?"
 sinosauria.6.a:0 "Arm the local population"
 sinosauria.6.t:0 "Unguarded Nomadic Frontier"
 sinosauria.6.d:0 "With our weakened army, nomadic dinosaurs on our borders have raided several towns and caused havoc in [SIN_nomadic_frontier_target.GetName]. We must figure out how to dispose of these raiders before they cause any more damage in the region."
 sinosauria.7.a:0 "Traitors!"
 sinosauria.7.t:0 "Fu Xi Forms Opposition"
 sinosauria.7.d:0 "Fu Xi has organized those opposing the court into an opposing government, plotting to overthrow us! They are beginning to fight over our imperial government for political and popular support. We have to stop him from gaining any power while we still can."
 sinosauria.8.a:0 "Traitors!"
 sinosauria.8.t:0 "The Court Forms Opposing Government"
 sinosauria.8.d:0 "With Fu Xi's ascension to the regency, the court has organized themselves and their supporters in to the Government of National Defense. Although they have no power in Sinosauria yet, they are beginning to gather support from our population. We have to stop them as soon as possible!"
 news.1.a:0 "Will Sinosauria remain the same?"
 news.1.b:0 "Sinosauria isn't the same without him"
 news.1.c:0 "Weakening an already broken Sinosauria."
 siberya.1.t:0 "Siberyan Supporters Rejoin Our Cause!"
 siberya.1.d:0 "The subjects of [SIB_neutral_state.GetName], has finally realized the evil and cruelty of the Saurviet regime, and has rejoined us and the Saurdom!"
 siberya.1.a:0 "We re-welcome our brothers!"
 siberya.2.t:0 "Siberyan Supporters Rejoin Our Cause!"
 siberya.2.d:0 "The subjects of [SIB_neutral_state.GetName] has backstabbed the Saurviet people and chose to rejoin the corrupt and greedy Tsaurdom. We must tell our followers to not join these foolish traitors."
 siberya.2.a:0 "They will be crushed by the Red Claw."
 gobero.1.t:0 "The Carnivores of Elrhaz"
 gobero.1.d:0 "With our herbivorous dominance over Irhazia, the carnivores that inhabit their share of the Elrhaz homeland have become part of a heated discussion amongst our herbivorous government. While many call for the expulsion of what they consider to be our natural enemies, harsh treatment of these carnivores can drastically hurt our diplomatic reputation with all the other carnivorous kingdoms of Irhazia, drastically decreasing any hope of unification through diplomacy."
 gobero.1.a:0 "Seize their lands and expel them!"
 gobero.1.b:0 "No, all Irhazians are brothers!"
 modernization.1.t:0 "Growth of Foreign Ideologies"
 modernization.1.d:0 "With the proliferation of modern ideas in administration and social structure throughout our subjects, foreign ideologies have also begun to take root in our people. They speak against our divine rule and plot for our downfall. We should silence them before they spread their foolishness further."
 modernization.1.a:0 "All a part of our efforts."
 modernization.1.b:0 "Root out these rabble-rousers."
 modernization.2.t:0 "Outraged Nobility"
 modernization.2.d:0 "Some parts of the nobility find our new efforts into modernization to be a threat to their power. They find themselves perfectly content with things as is and see no benefit in living in a modern country. Fearful that their privileges will soon be eroded away, they organize resistance against us."
 modernization.2.a:0 "Its their job to adapt"
 modernization.2.b:0 "Bring them to the table"
 modernization.3.t:0 "Military Officals Worried"
 modernization.3.d:0 "In our pursuit to establish a large and modern army, many military officials are worried in the growing number of foreign military advisors and changes in military structure. They are much more comfortable with the old system of running things, fearing that there will be no place for them in the new [Root.GetName]."
 modernization.3.a:0 "They need to get with the times"
 modernization.3.b:0 "Revert to the old ways"
 modernization.4.t:0 "Wave of Support"
 modernization.4.d:0 "With our efforts to pursue a modern society, many commoners find themselves presented with many new oppurtunities ahead of them. Poverty was now no longer an inevitability, and commoners could finally climb the social ladder. Just the idea of this possibility have given peasants reason to support us."
 modernization.4.a:0 "Further our efforts"
 modernization.4.b:0 "Use this to convince others"
 modernization.5.t:0 "Reactionary Uprising"
 modernization.5.d:0 "Many parts of our old traditions and institutions have been eroded away in the pursuit of greatness, and those who refuse to enter the light have taken armed resistance against us. They wish to bring us back to the dark age we were condemned to and to reverse all progress we have painstakingly made."
 modernization.5.a:0 "Put them down"
 modernization.5.b:0 "Reverse course"